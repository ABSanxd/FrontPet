<div class="container mt-5" style="max-width: 400px;">
  <h4 class="mb-4 text-center">Recuperar contraseña</h4>

  <form [formGroup]="form" (ngSubmit)="step === 'email' ? sendCode() : resetPassword()">

    @if (step === 'email') {
      <!-- Paso 1: Correo -->
      <label class="form-label small">Correo electrónico</label>
      <input type="email" class="form-control border-orange" formControlName="email" placeholder="tu@correo.com">
      <button type="submit" class="btn btn-orange w-100 mt-3" [disabled]="isLoading">
        {{ isLoading ? 'Enviando...' : 'Enviar código' }}
      </button>
    } @else if (step === 'code') {
      <!-- Paso 2: Código y nueva contraseña -->
      <label class="form-label small mt-3">Código recibido</label>
      <input type="text" class="form-control border-orange text-center" maxlength="6" formControlName="code" placeholder="000000">

      <label class="form-label small mt-3">Nueva contraseña</label>
      <input type="password" class="form-control border-orange" formControlName="newPassword" placeholder="•••••••••••••">

      <button type="submit" class="btn btn-orange w-100 mt-3" [disabled]="isLoading">
        {{ isLoading ? 'Actualizando...' : 'Restablecer contraseña' }}
      </button>
    }

    @if (message) {
      <div class="alert alert-success py-1 mt-3">{{ message }}</div>
    }

    @if (error) {
      <div class="alert alert-danger py-1 mt-3">{{ error }}</div>
    }

  </form>
</div>
