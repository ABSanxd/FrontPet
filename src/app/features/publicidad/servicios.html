<div class="container py-5">
  
  <header class="text-center mb-5">
    <h1 class="display-4 fw-bold text-primary-dark">Servicios Destacados</h1>
    <p class="lead text-muted">Encuentra los mejores profesionales y negocios para el cuidado de tu mascota.</p>
  </header>

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    @for (ad of serviceAds; track ad.id) {
      <div class="col">
        <app-service-ad-card [ad]="ad"></app-service-ad-card>
      </div>
    } @empty {
      <div class="col-12 text-center py-5">
        <i class="bi bi-info-circle-fill text-muted fs-3 mb-3"></i>
        <p class="text-muted">No hay servicios destacados disponibles por el momento.</p>
      </div>
    }
  </div>

</div>
