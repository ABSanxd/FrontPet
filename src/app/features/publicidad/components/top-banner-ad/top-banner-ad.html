<div class="banner-item h-100" [class.has-image]="ad.imageUrl" [class.no-image]="!ad.imageUrl">
  <!-- Con imagen -->
  @if (ad.imageUrl) {
  <div class="banner-image-container">
    <img
      [src]="ad.imageUrl"
      class="d-block w-100 banner-img"
      [alt]="ad.name"
      (error)="onImageError($event, ad)"
    />
    <div class="banner-overlay"></div>
  </div>
  }

  <!-- Sin imagen -->
  @if (!ad.imageUrl) {
  <div class="banner-gradient" [attr.data-priority]="ad.priority"></div>
  }

  <!-- Contenido -->
  <div class="banner-content-wrapper">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-8">
          <div class="banner-text">
            @if (ad.priority === 'PRIORITY_1') {
            <span class="badge priority-badge mb-2">
              <i class="bi bi-star-fill"></i> Destacado</span
            >
            }

            <h2 class="banner-title mb-3">{{ ad.name }}</h2>
            <p class="banner-description mb-4">{{ ad.description }}</p>

            <div class="banner-actions">
              @if(ad.link){
              <button (click)="abrirLink(ad.link)" class="btn btn-banner btn-primary">
                Ver más
                <i class="bi bi-arrow-right ms-2"></i>
              </button>
              } @else if(ad.contact.socialMedia){
              <button
                (click)="abrirLink(ad.contact.socialMedia!.url)"
                class="btn btn-banner btn-primary"
              >
                <i [class]="getSocialIcon(ad.contact.socialMedia!.type)"></i>
                <span class="px-2">{{ getSocialName(ad.contact.socialMedia!.type) }}</span>
              </button>
              } @if (ad.contact.phone) {
              <a [href]="'tel:' + ad.contact.phone" class="btn btn-banner btn-outline-light ms-2">
                <i class="bi bi-telephone-fill me-2"></i>
                Llamar
              </a>
              } @else if(ad.contact.email){
              <a
                [href]="'mailto:' + ad.contact.email"
                class="btn btn-banner btn-outline-light ms-2"
              >
                <i class="bi bi-envelope-heart-fill me-2"></i>
                Enviar correo
              </a>
              }
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
