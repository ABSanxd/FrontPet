<div class="container mt-4 pb-5">
  
  <div class="row g-4"> <div class="col-lg-8">
      
      <app-listar-mascotas></app-listar-mascotas>

      <div class="mt-5">
        <div class="p-4 bg-white rounded-4 shadow-sm border dashboard-card">
          <div class="d-flex justify-content-between align-items-center mb-3">
             <h4 class="fw-bold m-0" style="color: var(--color-orange)">
               <i class="bi bi-lightning-charge-fill me-2"></i>
               Tus Retos del Día
             </h4>
             <span class="badge bg-light text-dark border">Hoy</span>
          </div>
          
          <div class="list-group list-group-flush">
             <div class="list-group-item border-0 px-0 py-2 d-flex align-items-center">
                <i class="bi bi-check-circle-fill text-success fs-4 me-3"></i>
                <div>
                   <h6 class="mb-0 fw-bold text-dark">Paseo matutino</h6>
                   <small class="text-muted">Completado con Maylo (+50 XP)</small>
                </div>
             </div>
             <div class="list-group-item border-0 px-0 py-2 d-flex align-items-center">
                <i class="bi bi-circle text-secondary fs-4 me-3"></i>
                <div>
                   <h6 class="mb-0 fw-bold text-dark">Cepillado suave</h6>
                   <small class="text-muted">Pendiente con El Michi (+30 XP)</small>
                </div>
             </div>
          </div>

          <div class="mt-3 pt-3 border-top text-center">
             <button (click)="mostrarPopupDespuesDeReto()" class="btn btn-orange rounded-pill px-4">
                <i class="bi bi-play-fill"></i> Simular Completar Reto
             </button>
          </div>
        </div>
      </div>

    </div>

    <div class="col-lg-4">
       
       <app-ranking></app-ranking>
       
       <div class="mt-4 position-sticky" style="top: 20px;">
          <p class="text-muted small text-center mb-2">PUBLICIDAD</p>
          </div>
    </div>

  </div>
      <hr class="my-5" />
       <app-user-achievements [userId]="currentUserId"></app-user-achievements>

     
  </div>
  
</div>
