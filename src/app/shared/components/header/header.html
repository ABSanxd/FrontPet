<nav class="navbar navbar-expand-lg bg-white shadow-sm px-3">
    <div class="container-fluid">
        <!-- Logo -->
        <a class="navbar-brand d-flex align-items-center" routerLink="/">
            <img src="/assets/logo-green.svg" alt="Logo" style="height: 50px;" />
        </a>

        <!-- Botón hamburguesa -->
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Menú colapsable -->
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <div
                class="text-end w-100 w-lg-auto d-flex flex-column flex-lg-row align-items-center justify-content-center justify-content-lg-end">

                <!-- Si NO está autenticado -->
                @if (!auth.isAuthenticated()) {
                <button class="btn btn-green btn-sm rounded-pill me-2 mb-2 mb-lg-0" data-bs-toggle="modal"
                    data-bs-target="#loginModal">
                    Iniciar sesión
                </button>

                <button class="btn btn-orange btn-sm rounded-pill mb-2 mb-lg-0" data-bs-toggle="modal"
                    data-bs-target="#registerModal">
                    Registrarse
                </button>
                }

                <!-- Si está autenticado -->
                @if (auth.isAuthenticated()) {
                <ul
                    class="navbar-nav d-flex flex-column flex-lg-row align-items-center mb-2 mb-lg-0 me-3 text-center text-lg-start">
                    <li class="nav-item"><a class="nav-link fw-semibold" routerLink="/inicio">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" routerLink="/adopciones">Adopciones</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" routerLink="/servicios">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" routerLink="/donaciones">Donaciones</a></li>
                </ul>

                <!-- Iconos usuario y notificaciones -->
                <div class="d-flex align-items-center flex-column flex-lg-row">
                    <button class="rounded-circle d-flex justify-content-center align-items-center me-3 mb-2 mb-lg-0"
                        style="width: 35px; height: 35px; font-weight: bold; background-color: var(--color-cyan); color: white; border: none;"
                        title="Perfil" routerLink="/perfil">
                        {{ getUserInitial() }}
                        
                    </button>

                    <!-- Campana notificaciones -->
                    <button class="btn p-2 me-3 mb-2 mb-lg-0">
                        <i class="bi bi-bell-fill" style="color: var(--color-grey-dark); font-size: 1.2rem;"></i>
                    </button>

                    <!-- Cerrar sesión -->
                    <button class="btn btn-red btn-sm mb-2 mb-lg-0" (click)="logout()">

                </div>
